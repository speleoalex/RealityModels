<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiverso con convergenze</title>
<style>
/* Theme tokens: light on :root, dark for the system preference (unless light is forced) and for the explicit choice */
:root {
  --bg: #f7f7f5;
  --panel: #ffffff;
  --control: #fafafa;
  --text: #222;
  --muted: #666;
  --border: #ddd;
  --code: #f0f0f0;
  --stat: #3a6ea5;
  --mov: #e07b1a;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #eb6834;
  --ramp-1: #cde2fb;
  --ramp-2: #9ec5f4;
  --ramp-3: #5598e7;
  --ramp-4: #2a78d6;
  --ramp-5: #184f95;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1d22;
    --panel: #23262d;
    --control: #2c3038;
    --text: #e6e6e6;
    --muted: #a0a3aa;
    --border: #3a3d45;
    --code: #30343c;
    --grid: #2c2c2a;
    --axis: #383835;
    --accent: #d95926;
    --ramp-1: #184f95;
    --ramp-2: #256abf;
    --ramp-3: #3987e5;
    --ramp-4: #6da7ec;
    --ramp-5: #b7d3f6;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #1b1d22;
  --panel: #23262d;
  --control: #2c3038;
  --text: #e6e6e6;
  --muted: #a0a3aa;
  --border: #3a3d45;
  --code: #30343c;
  --grid: #2c2c2a;
  --axis: #383835;
  --accent: #d95926;
  --ramp-1: #184f95;
  --ramp-2: #256abf;
  --ramp-3: #3987e5;
  --ramp-4: #6da7ec;
  --ramp-5: #b7d3f6;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}

body { display: flex; }

#panel {
  width: 340px;
  flex: 0 0 340px;
  height: 100%;
  overflow-y: auto;
  padding: 16px 18px 24px;
  background: var(--panel);
  border-right: 1px solid var(--border);
}

#view { flex: 1 1 auto; height: 100%; min-width: 0; position: relative; }

#graphBox { position: absolute; inset: 0; }
#graphBox canvas { display: block; }

h1 { font-size: 20px; margin: 0 0 8px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
.intro { margin: 0; line-height: 1.45; }


label { display: block; margin: 10px 0 4px; }

input[type=range] { width: 100%; height: 44px; margin: 0; cursor: pointer; }
input[type=number], select {
  min-height: 44px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--control);
  color: var(--text);
  font: inherit;
}
input[type=number] { width: 80px; }

.row { display: flex; gap: 8px; align-items: center; }
.row input[type=range] { flex: 1 1 auto; }

.note { color: var(--muted); font-size: 12px; line-height: 1.4; margin: 6px 0 0; }

.buttons { display: flex; gap: 6px; }
.buttons.stack { flex-direction: column; }
.buttons button {
  flex: 1 1 0;
  min-height: 44px;
  padding: 6px 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--control);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}
.buttons button.active { background: var(--stat); color: #fff; border-color: var(--stat); }

:focus-visible { outline: 2px solid var(--mov); outline-offset: 2px; }

#readout { width: 100%; border-collapse: collapse; }
#readout th { text-align: left; font-weight: normal; color: var(--muted); width: 70%; }
#readout td { text-align: right; font-variant-numeric: tabular-nums; }
#readout th, #readout td { padding: 6px 2px; border-bottom: 1px solid var(--border); }

.legend { list-style: none; margin: 0; padding: 0; }
.legend li { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.sw { flex: 0 0 auto; display: inline-block; width: 18px; height: 12px; border-radius: 2px; }
.sw-node { background: var(--ramp-4); border-radius: 6px; }
.sw-edge { height: 2px; background: var(--ramp-4); }
.sw-hollow { border: 1px solid var(--muted); border-radius: 6px; }
.sw-accent { background: var(--accent); border-radius: 6px; }
.sw-compare { height: 0; border-top: 2px solid var(--accent); }

code { background: var(--code); padding: 1px 4px; border-radius: 3px; }

#tooltip {
  position: absolute;
  pointer-events: none;
  max-width: 260px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
  font-size: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
}
#tooltip b { display: block; margin-bottom: 4px; }
#tooltip div { display: flex; justify-content: space-between; gap: 12px; }
#tooltip div span:first-child { color: var(--muted); }
#tooltip div span:last-child { font-variant-numeric: tabular-nums; }

#tableBox { position: absolute; inset: 0; overflow: auto; padding: 16px; }
#table { border-collapse: collapse; min-width: 100%; }
#table caption { text-align: left; font-weight: bold; padding: 0 0 8px; }
#table th, #table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
#table th { color: var(--muted); font-weight: normal; }

.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 760px) {
  body { flex-direction: column; }
  #panel { width: 100%; flex: 0 0 auto; height: auto; max-height: 50%; border-right: 0; border-bottom: 1px solid var(--border); }
  #view { height: 50%; }
}

</style>
<style>
/* Language and theme overlay (shared/js/settings.js); colors come from the page's theme tokens */
.settings-overlay { position: fixed; top: 10px; right: 10px; z-index: 10; }

.settings-toggle {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
}
.settings-toggle svg { width: 22px; height: 22px; }

.settings-panel {
  position: absolute;
  top: 52px;
  right: 0;
  width: 260px;
  max-width: calc(100vw - 20px);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 10px;
  align-items: center;
  padding: 12px 14px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
}
.settings-panel[hidden] { display: none; }
.settings-panel h2 { grid-column: 1 / -1; margin: 0; }
.settings-panel label { margin: 0; }

/* on narrow screens the side panel is on top: keep its title clear of the button */
@media (max-width: 760px) {
  #panel h1 { padding-right: 52px; }
}

</style>
</head>
<body>
<aside id="panel">
  <h1 data-i18n="heading"></h1>
  <p class="intro" data-i18n-html="intro"></p>

  <h2 data-i18n="parameters"></h2>
  <label id="outcomesLabel" for="outcomes" data-i18n="outcomesLabel"></label>
  <div class="row">
    <input type="range" id="outcomes" min="2" max="4" step="1" value="2">
    <input type="number" id="outcomesNum" min="2" max="4" step="1" value="2" aria-labelledby="outcomesLabel">
  </div>
  <label id="stepsLabel" for="steps" data-i18n="stepsLabel"></label>
  <div class="row">
    <input type="range" id="steps" min="1" max="40" step="1" value="20">
    <input type="number" id="stepsNum" min="1" max="40" step="1" value="20" aria-labelledby="stepsLabel">
  </div>
  <p class="note" id="stepsNote" hidden></p>
  <label id="disorderLabel" for="disorder" data-i18n="disorderLabel"></label>
  <div class="row">
    <input type="range" id="disorder" min="0" max="1" step="0.05" value="0">
    <input type="number" id="disorderNum" min="0" max="1" step="0.05" value="0" aria-labelledby="disorderLabel">
  </div>
  <label for="seed" data-i18n="seedLabel"></label>
  <input type="number" id="seed" min="0" max="99999" step="1" value="1">

  <h2 data-i18n="regime"></h2>
  <div class="buttons stack">
    <button type="button" data-regime="tree" data-i18n="regimeTree"></button>
    <button type="button" data-regime="classical" data-i18n="regimeClassical"></button>
    <button type="button" data-regime="quantum" data-i18n="regimeQuantum"></button>
  </div>
  <p class="note" id="regimeNote"></p>

  <h2 data-i18n="time"></h2>
  <label id="stepLabel" for="step" data-i18n="stepLabel"></label>
  <div class="row">
    <input type="range" id="step" min="0" max="20" step="1" value="20">
    <input type="number" id="stepNum" min="0" max="20" step="1" value="20" aria-labelledby="stepLabel">
  </div>
  <div class="buttons"><button type="button" id="play" data-i18n="play"></button></div>

  <h2 data-i18n="view"></h2>
  <div class="buttons">
    <button type="button" data-view="graph" data-i18n="viewGraph"></button>
    <button type="button" data-view="table" data-i18n="viewTable"></button>
  </div>

  <h2 data-i18n="readings"></h2>
  <table id="readout">
    <tr><th data-i18n-html="rWorldsTree"></th><td id="rWorldsTree"></td></tr>
    <tr><th data-i18n="rDistinct"></th><td id="rDistinct"></td></tr>
    <tr><th data-i18n="rEffClassical"></th><td id="rEffClassical"></td></tr>
    <tr><th data-i18n="rEffQuantum"></th><td id="rEffQuantum"></td></tr>
    <tr><th data-i18n="rSigmaClassical"></th><td id="rSigmaClassical"></td></tr>
    <tr><th data-i18n="rSigmaQuantum"></th><td id="rSigmaQuantum"></td></tr>
    <tr><th data-i18n="rSuppressedEdges"></th><td id="rSuppressedEdges"></td></tr>
    <tr><th data-i18n="rSuppressedNodes"></th><td id="rSuppressedNodes"></td></tr>
  </table>

  <h2 data-i18n="legend"></h2>
  <ul class="legend">
    <li><span class="sw sw-node"></span><span data-i18n="legNode"></span></li>
    <li><span class="sw sw-edge"></span><span data-i18n="legEdge"></span></li>
    <li><span class="sw sw-hollow"></span><span data-i18n="legSuppressed"></span></li>
    <li><span class="sw sw-accent"></span><span data-i18n="legHighlight"></span></li>
    <li><span class="sw sw-compare"></span><span data-i18n="legHistogram"></span></li>
  </ul>
  <p class="note" data-i18n-html="docNote"></p>
</aside>

<main id="view">
  <div id="graphBox">
    <span id="graphTitle" class="visually-hidden" data-i18n="graphAria"></span>
    <canvas id="graph" role="img" aria-labelledby="graphTitle"></canvas>
    <div id="tooltip" hidden></div>
  </div>
  <div id="tableBox" hidden>
    <table id="table">
      <caption id="tableCaption"></caption>
      <thead>
        <tr>
          <th data-i18n="thState"></th>
          <th data-i18n="thPaths"></th>
          <th data-i18n="thPClassical"></th>
          <th data-i18n="thPQuantum"></th>
          <th data-i18n="thRatio"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

 */

    ctx.textBaseline = 'bottom';
    ctx.fillText(text('histTitle', { t: s.step }), h.left, h.top - 6);
    ctx.fillStyle = theme.muted;
    ctx.textAlign = 'right';
    ctx.fillText(text('histMax', { p: formatProbability(pMax) }), h.left + h.width, h.top - 6);
    ctx.strokeStyle = theme.axis;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(h.left, h.top + h.height + 0.5); ctx.lineTo(h.left + h.width, h.top + h.height + 0.5); ctx.stroke();
    nodes.forEach(function (node, k) {
      var top = yOf(node[pKey]);
      ctx.fillStyle = k === hovered ? theme.accent : theme.ramp[3];
      if (top < h.top + h.height) ctx.fillRect(xOf(node.x) - barWidth / 2, top, barWidth, h.top + h.height - top);
    });
    if (quantum) { // classical distribution as a step outline, for comparison
      ctx.strokeStyle = theme.accent;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      nodes.forEach(function (node, k) {
        var y = yOf(node.pClassical), left = xOf(node.x) - slot / 2;
        if (k === 0) ctx.moveTo(left, y); else ctx.lineTo(left, y);
        ctx.lineTo(left + slot, y);
      });
      ctx.stroke();
    }
    var step = tickStep(unit, 24);
    ctx.fillStyle = theme.muted;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (var v = -Math.floor(range / step) * step; v <= range; v += step) ctx.fillText(v, xOf(v), h.top + h.height + 4);
  };

  MultiverseGraph.prototype.pointAt = function (px, py) {
    var s = this.state, plot = this.plot;
    if (!s || !plot || py < plot.top - HOVER_RADIUS || py > plot.bottom + HOVER_RADIUS) return null;
    var t = Math.round((px - plot.left) / plot.width * s.steps);
    if (t < 0 || t > s.step || Math.abs(this.xOf(t) - px) > HOVER_RADIUS) return null;
    var tree = s.regime === 'tree', count = tree ? Math.pow(s.outcomes, t) : s.lattice[t].length;
    var best = null, bestDistance = HOVER_RADIUS;
    for (var i = 0; i < count; i++) {
      var d = Math.abs((tree ? this.yOfTree(i, count) : this.yOf(s.lattice[t][i].x)) - py);
      if (d < bestDistance) { bestDistance = d; best = { t: t, index: i }; }
    }
    return best;
  };

  MultiverseGraph.prototype.setHover = function (hover, event) {
    var previous = this.hover;
    if (!!hover !== !!previous || (hover && (hover.t !== previous.t || hover.index !== previous.index))) {
      this.hover = hover;
      this.draw();
    }
    if (!hover) { this.tooltip.hidden = true; return; }
    this.tooltip.innerHTML = this.describe(hover);
    this.tooltip.hidden = false;
    var box = this.canvas.parentElement, left = event.offsetX + 14, top = event.offsetY + 14;
    if (left + this.tooltip.offsetWidth > box.clientWidth - 4) left = Math.max(4, event.offsetX - 14 - this.tooltip.offsetWidth);
    if (top + this.tooltip.offsetHeight > box.clientHeight - 4) top = Math.max(4, event.offsetY - 14 - this.tooltip.offsetHeight);
    this.tooltip.style.left = left + 'px';
    this.tooltip.style.top = top + 'px';
  };

  MultiverseGraph.prototype.describe = function (hover) {
    var s = this.state, text = s.text, rows;
    if (s.regime === 'tree') {
      var k = digitSum(hover.index, s.outcomes, hover.t);
      rows = [
        [text('ttPath'), digitsOf(hover.index, s.outcomes, hover.t).join(' ') || '–'],
        [text('ttState'), 2 * k - (s.outcomes - 1) * hover.t],
        [text('ttProbability'), formatProbability(Math.pow(s.outcomes, -hover.t))],
        [text('ttSameState'), formatCount(s.lattice[hover.t][k].paths)]
      ];
    } else {
      var node = s.lattice[hover.t][hover.index];
      rows = [
        [text('ttState'), node.x],
        [text('ttPaths'), formatCount(node.paths)],
        [text('ttPClassical'), formatProbability(node.pClassical)],
        [text('ttPQuantum'), formatProbability(node.pQuantum)]
      ];
    }
    return '<b>' + text('ttStep', { t: hover.t }) + '</b>' + rows.map(function (r) { return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'; }).join('');
  };

  MultiverseGraph.formatProbability = formatProbability;
  MultiverseGraph.formatCount = formatCount;
  root.MultiverseGraph = MultiverseGraph;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * app.js: wires the controls to the model and the renderer. Language and theme
 * come from the shared overlay (shared/js/settings.js); the state of the simulation
 * is mirrored in the query string so a view can be linked.
 */
(function () {
  'use strict';

  var TREE_NODE_LIMIT = 4096; // worlds drawn at the last step of the tree view
  var FRAME_MS = 400;
  var LIMITS = { outcomes: [2, 4], steps: [1, 40], disorder: [0, 1], seed: [0, 99999] };
  var REGIMES = ['tree', 'classical', 'quantum'];
  var NOTE_KEYS = { tree: 'regimeNoteTree', classical: 'regimeNoteClassical', quantum: 'regimeNoteQuantum' };

  var els = {};
  ['outcomes', 'outcomesNum', 'steps', 'stepsNum', 'stepsNote', 'disorder', 'disorderNum', 'seed',
    'regimeNote', 'step', 'stepNum', 'play', 'graph', 'tooltip', 'graphBox', 'tableBox', 'tableCaption', 'tableBody',
    'rWorldsTree', 'rDistinct', 'rEffClassical', 'rEffQuantum', 'rSigmaClassical', 'rSigmaQuantum', 'rSuppressedEdges', 'rSuppressedNodes'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  var formatProbability = MultiverseGraph.formatProbability, formatCount = MultiverseGraph.formatCount;
  var graph = new MultiverseGraph(els.graph, els.tooltip);
  var regime = 'quantum', view = 'graph', lattice = null, timer = null;

  function clamp(value, limits, fallback) {
    var v = parseFloat(value);
    return isNaN(v) ? fallback : Math.min(limits[1], Math.max(limits[0], v));
  }
  function setPair(range, num, value) { range.value = value; num.value = value; }

  function setRegime(value) {
    regime = value;
    document.querySelectorAll('[data-regime]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.regime === regime);
      b.setAttribute('aria-pressed', b.dataset.regime === regime);
    });
    var max = LIMITS.steps[1];
    if (regime === 'tree') max = Math.min(max, Math.floor(Math.log(TREE_NODE_LIMIT) / Math.log(+els.outcomes.value) + 1e-9));
    els.steps.max = els.stepsNum.max = max;
    if (+els.steps.value > max) setPair(els.steps, els.stepsNum, max);
    els.stepsNote.hidden = regime !== 'tree';
    els.stepsNote.textContent = I18n.t('stepsTreeNote', { max: max });
    els.regimeNote.innerHTML = I18n.t(NOTE_KEYS[regime]);
  }

  function setView(value) {
    view = value;
    document.querySelectorAll('[data-view]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.view === view);
      b.setAttribute('aria-pressed', b.dataset.view === view);
    });
    els.graphBox.hidden = view !== 'graph';
    els.tableBox.hidden = view !== 'table';
  }

  function rebuild() {
    lattice = Model.buildLattice({ outcomes: +els.outcomes.value, steps: +els.steps.value, disorder: +els.disorder.value, seed: +els.seed.value });
    els.step.max = els.stepNum.max = els.steps.value;
    if (+els.step.value > +els.steps.value) setPair(els.step, els.stepNum, els.steps.value);
  }

  function renderTable(step) {
    els.tableCaption.textContent = I18n.t('histTitle', { t: step });
    els.tableBody.innerHTML = lattice[step].map(function (node) {
      return '<tr><td>' + node.x + '</td><td>' + formatCount(node.paths) + '</td><td>' + formatProbability(node.pClassical) +
        '</td><td>' + formatProbability(node.pQuantum) + '</td><td>' + (node.pQuantum / node.pClassical).toFixed(3) + '</td></tr>';
    }).join('');
  }

  function updateUrl() {
    var q = new URLSearchParams({
      n: els.outcomes.value, T: els.steps.value, reg: regime, dis: els.disorder.value, seed: els.seed.value,
      step: els.step.value, view: view, lang: I18n.getLanguage()
    });
    try { history.replaceState(null, '', '?' + q); } catch (e) { /* not allowed on some file:// setups */ }
  }

  function refresh() {
    var step = +els.step.value;
    graph.update({ lattice: lattice, outcomes: +els.outcomes.value, steps: +els.steps.value, step: step, regime: regime, text: I18n.t });
    var s = Model.statistics(lattice, step);
    els.rWorldsTree.textContent = formatCount(s.treeWorlds);
    els.rDistinct.textContent = formatCount(s.distinct);
    els.rEffClassical.textContent = s.effectiveClassical.toFixed(2);
    els.rEffQuantum.textContent = s.effectiveQuantum.toFixed(2);
    els.rSigmaClassical.textContent = s.sigmaClassical.toFixed(2);
    els.rSigmaQuantum.textContent = s.sigmaQuantum.toFixed(2);
    els.rSuppressedEdges.textContent = formatCount(s.suppressedEdges);
    els.rSuppressedNodes.textContent = formatCount(s.suppressedNodes);
    if (view === 'table') renderTable(step);
    updateUrl();
  }

  function setPlaying(on) {
    if (timer) { clearInterval(timer); timer = null; }
    if (on) {
      if (+els.step.value >= +els.steps.value) { setPair(els.step, els.stepNum, 0); refresh(); }
      timer = setInterval(function () {
        var next = +els.step.value + 1;
        if (next > +els.steps.value) { setPlaying(false); return; }
        setPair(els.step, els.stepNum, next);
        refresh();
      }, FRAME_MS);
    }
    els.play.dataset.i18n = on ? 'pause' : 'play';
    els.play.textContent = I18n.t(els.play.dataset.i18n);
  }

  function bindPair(range, num, onChange) {
    range.addEventListener('input', function () { num.value = range.value; onChange(); });
    num.addEventListener('input', function () {
      var v = parseFloat(num.value);
      if (isNaN(v)) return;
      range.value = Math.min(parseFloat(range.max), Math.max(parseFloat(range.min), v));
      onChange();
    });
  }

  /* Initial state: query string, then defaults; a change of language or theme redraws everything */
  var qs = new URLSearchParams(location.search);
  Settings.init(function () { setRegime(regime); refresh(); });
  setPair(els.outcomes, els.outcomesNum, clamp(qs.get('n'), LIMITS.outcomes, 2));
  setPair(els.steps, els.stepsNum, clamp(qs.get('T'), LIMITS.steps, 20));
  setPair(els.disorder, els.disorderNum, clamp(qs.get('dis'), LIMITS.disorder, 0));
  els.seed.value = clamp(qs.get('seed'), LIMITS.seed, 1);
  setRegime(REGIMES.indexOf(qs.get('reg')) >= 0 ? qs.get('reg') : 'quantum');
  setView(qs.get('view') === 'table' ? 'table' : 'graph');
  rebuild();
  setPair(els.step, els.stepNum, clamp(qs.get('step'), [0, +els.steps.value], +els.steps.value));
  refresh();

  bindPair(els.outcomes, els.outcomesNum, function () { setRegime(regime); rebuild(); refresh(); });
  bindPair(els.steps, els.stepsNum, function () { rebuild(); setPair(els.step, els.stepNum, els.steps.value); refresh(); });
  bindPair(els.disorder, els.disorderNum, function () { rebuild(); refresh(); });
  bindPair(els.step, els.stepNum, refresh);
  els.seed.addEventListener('input', function () { rebuild(); refresh(); });
  els.play.addEventListener('click', function () { setPlaying(!timer); });
  document.querySelectorAll('[data-regime]').forEach(function (b) {
    b.addEventListener('click', function () {
      var steps = els.steps.value;
      setRegime(b.dataset.regime);
      if (els.steps.value !== steps) rebuild();
      refresh();
    });
  });
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () { setView(b.dataset.view); refresh(); });
  });
})();

</script>
</body>
