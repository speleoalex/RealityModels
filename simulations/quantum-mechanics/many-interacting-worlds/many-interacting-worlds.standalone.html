<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Molti mondi interagenti</title>
<style>
/* Theme tokens: light on :root, dark for the system preference (unless light is forced) and for the explicit choice */
:root {
  --bg: #f7f7f5;
  --panel: #ffffff;
  --control: #fafafa;
  --text: #222;
  --muted: #666;
  --border: #ddd;
  --code: #f0f0f0;
  --stat: #3a6ea5;
  --mov: #e07b1a;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #eb6834;
  --ramp-1: #cde2fb;
  --ramp-2: #9ec5f4;
  --ramp-3: #5598e7;
  --ramp-4: #2a78d6;
  --ramp-5: #184f95;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1d22;
    --panel: #23262d;
    --control: #2c3038;
    --text: #e6e6e6;
    --muted: #a0a3aa;
    --border: #3a3d45;
    --code: #30343c;
    --grid: #2c2c2a;
    --axis: #383835;
    --accent: #d95926;
    --ramp-1: #184f95;
    --ramp-2: #256abf;
    --ramp-3: #3987e5;
    --ramp-4: #6da7ec;
    --ramp-5: #b7d3f6;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #1b1d22;
  --panel: #23262d;
  --control: #2c3038;
  --text: #e6e6e6;
  --muted: #a0a3aa;
  --border: #3a3d45;
  --code: #30343c;
  --grid: #2c2c2a;
  --axis: #383835;
  --accent: #d95926;
  --ramp-1: #184f95;
  --ramp-2: #256abf;
  --ramp-3: #3987e5;
  --ramp-4: #6da7ec;
  --ramp-5: #b7d3f6;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}

body { display: flex; }

#panel {
  width: 340px;
  flex: 0 0 340px;
  height: 100%;
  overflow-y: auto;
  padding: 16px 18px 24px;
  background: var(--panel);
  border-right: 1px solid var(--border);
}

#view { flex: 1 1 auto; height: 100%; min-width: 0; position: relative; }

#graphBox { position: absolute; inset: 0; }
#graphBox canvas { display: block; }

h1 { font-size: 20px; margin: 0 0 8px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
.intro { margin: 0; line-height: 1.45; }


label { display: block; margin: 10px 0 4px; }

input[type=range] { width: 100%; height: 44px; margin: 0; cursor: pointer; }
input[type=number], select {
  min-height: 44px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--control);
  color: var(--text);
  font: inherit;
}
input[type=number] { width: 80px; }

.row { display: flex; gap: 8px; align-items: center; }
.row input[type=range] { flex: 1 1 auto; }

.note { color: var(--muted); font-size: 12px; line-height: 1.4; margin: 6px 0 0; }

.buttons { display: flex; gap: 6px; }
.buttons.stack { flex-direction: column; }
.buttons button {
  flex: 1 1 0;
  min-height: 44px;
  padding: 6px 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--control);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}
.buttons button.active { background: var(--stat); color: #fff; border-color: var(--stat); }

:focus-visible { outline: 2px solid var(--mov); outline-offset: 2px; }

#readout { width: 100%; border-collapse: collapse; }
#readout th { text-align: left; font-weight: normal; color: var(--muted); width: 70%; }
#readout td { text-align: right; font-variant-numeric: tabular-nums; }
#readout th, #readout td { padding: 6px 2px; border-bottom: 1px solid var(--border); }

.legend { list-style: none; margin: 0; padding: 0; }
.legend li { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.sw { flex: 0 0 auto; display: inline-block; width: 18px; height: 12px; border-radius: 2px; }
.sw-world { height: 2px; background: var(--accent); }
.sw-chosen { height: 3px; background: var(--mov); }
.sw-discarded { height: 2px; background: var(--muted); opacity: .5; }
.sw-density { background: var(--accent); opacity: .6; }
.sw-theory { height: 0; border-top: 2px dashed var(--stat); }

code { background: var(--code); padding: 1px 4px; border-radius: 3px; }

#tooltip {
  position: absolute;
  pointer-events: none;
  max-width: 260px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
  font-size: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
}
#tooltip b { display: block; margin-bottom: 4px; }
#tooltip div { display: flex; justify-content: space-between; gap: 12px; }
#tooltip div span:first-child { color: var(--muted); }
#tooltip div span:last-child { font-variant-numeric: tabular-nums; }

.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 760px) {
  body { flex-direction: column; }
  #panel { width: 100%; flex: 0 0 auto; height: auto; max-height: 50%; border-right: 0; border-bottom: 1px solid var(--border); }
  #view { height: 50%; }
}

</style>
<style>
/* Language and theme overlay (shared/js/settings.js); colors come from the page's theme tokens */
.settings-overlay { position: fixed; top: 10px; right: 10px; z-index: 10; }

.settings-toggle {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
}
.settings-toggle svg { width: 22px; height: 22px; }

.settings-panel {
  position: absolute;
  top: 52px;
  right: 0;
  width: 260px;
  max-width: calc(100vw - 20px);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 10px;
  align-items: center;
  padding: 12px 14px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
}
.settings-panel[hidden] { display: none; }
.settings-panel h2 { grid-column: 1 / -1; margin: 0; }
.settings-panel label { margin: 0; }

/* on narrow screens the side panel is on top: keep its title clear of the button */
@media (max-width: 760px) {
  #panel h1 { padding-right: 52px; }
}

</style>
</head>
<body>
<aside id="panel">
  <h1 data-i18n="heading"></h1>
  <p class="intro" data-i18n-html="intro"></p>

  <h2 data-i18n="scenario"></h2>
  <div class="buttons stack">
    <button type="button" data-scenario="ground" data-i18n="scGround"></button>
    <button type="button" data-scenario="free" data-i18n="scFree"></button>
    <button type="button" data-scenario="collision" data-i18n="scCollision"></button>
    <button type="button" data-scenario="measure" data-i18n="scMeasure"></button>
  </div>
  <p class="note" id="scenarioNote"></p>

  <h2 data-i18n="parameters"></h2>
  <label id="worldsLabel" for="worlds" data-i18n="worldsLabel"></label>
  <div class="row">
    <input type="range" id="worlds" min="1" max="80" step="1" value="20">
    <input type="number" id="worldsNum" min="1" max="80" step="1" value="20" aria-labelledby="worldsLabel">
  </div>
  <label id="omegaLabel" for="omega" data-i18n="omegaLabel"></label>
  <div class="row">
    <input type="range" id="omega" min="0.2" max="3" step="0.1" value="1">
    <input type="number" id="omegaNum" min="0.2" max="3" step="0.1" value="1" aria-labelledby="omegaLabel">
  </div>
  <div id="speedGroup" hidden>
    <label id="speedLabel" for="speed" data-i18n="speedLabel"></label>
    <div class="row">
      <input type="range" id="speed" min="0.5" max="6" step="0.5" value="3">
      <input type="number" id="speedNum" min="0.5" max="6" step="0.5" value="3" aria-labelledby="speedLabel">
    </div>
  </div>
  <div id="deltaGroup" hidden>
    <label id="deltaLabel" for="delta" data-i18n="deltaLabel"></label>
    <div class="row">
      <input type="range" id="delta" min="0.1" max="2" step="0.05" value="0.4">
      <input type="number" id="deltaNum" min="0.1" max="2" step="0.05" value="0.4" aria-labelledby="deltaLabel">
    </div>
    <div class="buttons"><button type="button" id="measureBtn" data-i18n="doMeasure"></button></div>
    <p class="note" id="measureNote"></p>
  </div>

  <h2 data-i18n="run"></h2>
  <div class="buttons">
    <button type="button" id="play" data-i18n="pause"></button>
    <button type="button" id="restart" data-i18n="restart"></button>
  </div>

  <h2 data-i18n="readings"></h2>
  <table id="readout">
    <tr><th data-i18n="rWorlds"></th><td id="rWorlds"></td></tr>
    <tr><th data-i18n="rDx"></th><td id="rDx"></td></tr>
    <tr><th data-i18n="rDp"></th><td id="rDp"></td></tr>
    <tr><th data-i18n="rProduct"></th><td id="rProduct"></td></tr>
    <tr><th data-i18n="rBound"></th><td id="rBound"></td></tr>
    <tr><th data-i18n="rEnergy"></th><td id="rEnergy"></td></tr>
    <tr id="rowEnergyExp"><th data-i18n="rEnergyExp"></th><td id="rEnergyExp"></td></tr>
    <tr id="rowSpread" hidden><th data-i18n="rSpread"></th><td id="rSpread"></td></tr>
  </table>

  <h2 data-i18n="legend"></h2>
  <ul class="legend">
    <li><span class="sw sw-world"></span><span data-i18n="legWorld"></span></li>
    <li><span class="sw sw-chosen"></span><span data-i18n="legChosen"></span></li>
    <li><span class="sw sw-discarded"></span><span data-i18n="legDiscarded"></span></li>
    <li><span class="sw sw-density"></span><span data-i18n="legDensity"></span></li>
    <li><span class="sw sw-theory"></span><span data-i18n="legTheory"></span></li>
  </ul>
  <p class="note" data-i18n-html="docNote"></p>
</aside>

<main id="view">
  <div id="graphBox">
    <span id="graphTitle" class="visually-hidden" data-i18n="graphAria"></span>
    <canvas id="graph" role="img" aria-labelledby="graphTitle"></canvas>
    <div id="tooltip" hidden></div>
  </div>
</main>

    var ty = Math.min(event.offsetY + 14, box.height - this.tooltip.offsetHeight - 8);
    this.tooltip.style.left = Math.max(0, tx) + 'px';
    this.tooltip.style.top = Math.max(0, ty) + 'px';
  };

  root.MiwGraph = MiwGraph;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * app.js: wires the controls to the model and the renderer. The simulation keeps a
 * list of decoupled ensembles ("parts"): one at the start, more after a measurement
 * splits the worlds into bins. World indices are global and never reorder, because
 * worlds cannot cross. Language and theme come from the shared overlay; the state
 * is mirrored in the query string so a configuration can be linked.
 */
(function () {
  'use strict';

  var LIMITS = { worlds: [1, 80], omega: [0.2, 3], speed: [0.5, 6], delta: [0.1, 2] };
  var SCENARIOS = ['ground', 'free', 'collision', 'measure'];
  var NOTE_KEYS = { ground: 'noteGround', free: 'noteFree', collision: 'noteCollision', measure: 'noteMeasure' };
  var SUBSTEP_BUDGET = 6000;  // substeps per frame, shared by the parts
  var HISTORY_MAX = 900;      // snapshots kept for the world lines
  var MAX_FRAME_DT = 0.035;   // simulated time units per frame, 1 unit per real second

  var els = {};
  ['worlds', 'worldsNum', 'omega', 'omegaNum', 'speed', 'speedNum', 'delta', 'deltaNum',
    'speedGroup', 'deltaGroup', 'scenarioNote', 'play', 'restart', 'measureBtn', 'measureNote',
    'rWorlds', 'rDx', 'rDp', 'rProduct', 'rBound', 'rEnergy', 'rEnergyExp', 'rSpread',
    'rowEnergyExp', 'rowSpread', 'graph', 'tooltip'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  var graph = new MiwGraph(els.graph, els.tooltip);
  var scenario = 'ground';
  var parts = [], keptIndex = 0, totalWorlds = 0;
  var discardedAt = [], chosen = -1, measureTimes = [], lastMeasure = null;
  var trail = [], dx0 = 1;
  var playing = true, lastNow = null;

  function clamp(value, limits, fallback) {
    var v = parseFloat(value);
    return isNaN(v) ? fallback : Math.min(limits[1], Math.max(limits[0], v));
  }
  function setPair(range, num, value) { range.value = value; num.value = value; }

  function keptCount() {
    var k = 0;
    for (var j = 0; j < totalWorlds; j++) if (discardedAt[j] === Infinity) k++;
    return k;
  }

  function pushSnapshot() {
    var x = new Array(totalWorlds);
    parts.forEach(function (p) {
      for (var m = 0; m < p.state.x.length; m++) x[p.first + m] = p.state.x[m];
    });
    trail.push({ t: parts[keptIndex].state.t, x: x });
    if (trail.length > HISTORY_MAX) trail.shift();
  }

  function currentVelocities() {
    var v = new Array(totalWorlds);
    parts.forEach(function (p) {
      for (var m = 0; m < p.state.v.length; m++) v[p.first + m] = p.state.v[m];
    });
    return v;
  }

  function overlay() {
    var w = +els.omega.value, t = parts[keptIndex].state.t;
    if (scenario === 'ground' || (scenario === 'measure' && !measureTimes.length)) {
      return { mean: 0, sigma: Math.sqrt(1 / (2 * w)) };
    }
    if (scenario === 'free') return { mean: 0, sigma: Math.sqrt((1 + w * w * t * t) / (2 * w)) };
    return null;
  }

  function build() {
    var n = +els.worlds.value, w = +els.omega.value, v0 = +els.speed.value;
    chosen = -1;
    measureTimes = [];
    lastMeasure = null;
    els.measureNote.textContent = '';
    if (scenario === 'collision') {
      var half = Model.groundState(Math.max(1, Math.round(n / 2)), w);
      var sq = 0;
      half.forEach(function (p) { sq += p * p / half.length; });
      var offset = Math.max(2, 4 * Math.sqrt(sq));
      var x = half.map(function (p) { return p - offset; }).concat(half.map(function (p) { return p + offset; }));
      var v = half.map(function () { return v0; }).concat(half.map(function () { return -v0; }));
      parts = [{ state: Model.createState(x, v, 0), first: 0 }];
    } else {
      parts = [{ state: Model.createState(Model.groundState(n, w), null, scenario === 'free' ? 0 : w), first: 0 }];
    }
    keptIndex = 0;
    totalWorlds = parts[0].state.x.length;
    discardedAt = new Array(totalWorlds);
    for (var j = 0; j < totalWorlds; j++) discardedAt[j] = Infinity;
    trail = [];
    dx0 = Model.statistics(parts[0].state).dx || 1;
    pushSnapshot();
    refresh(true);
  }

  function refresh(reset) {
    var kept = parts[keptIndex].state, t = kept.t, w = +els.omega.value;
    var s = Model.statistics(kept), k = kept.x.length;
    els.rWorlds.textContent = k + ' / ' + totalWorlds;
    els.rDx.textContent = s.dx.toFixed(3);
    els.rDp.textContent = s.dp.toFixed(3);
    els.rProduct.textContent = s.product.toFixed(3);
    els.rBound.textContent = ((1 - 1 / k) / 2).toFixed(3);
    els.rEnergy.textContent = s.energy.toFixed(3);
    els.rowEnergyExp.hidden = !(scenario === 'ground' || (scenario === 'measure' && !measureTimes.length));
    if (!els.rowEnergyExp.hidden) els.rEnergyExp.textContent = ((k - 1) * w / 2).toFixed(3);
    els.rowSpread.hidden = scenario !== 'free';
    if (!els.rowSpread.hidden) {
      els.rSpread.textContent = (s.dx / dx0).toFixed(3) + ' / ' + Math.sqrt(1 + w * w * t * t).toFixed(3);
    }
    graph.update({
      history: trail, v: currentVelocities(), discardedAt: discardedAt, chosen: chosen,
      measureTimes: measureTimes, overlay: overlay(), reset: reset, text: I18n.t
    });
    updateUrl();
  }

  function tick(dt) {
    var budget = Math.max(200, Math.floor(SUBSTEP_BUDGET / parts.length));
    parts.forEach(function (p) { Model.step(p.state, dt, budget); });
    pushSnapshot();
    refresh(false);
  }

  function frame(now) {
    if (playing && lastNow !== null) {
      var dt = Math.min(MAX_FRAME_DT, (now - lastNow) / 1000);
      if (dt > 0) tick(dt);
    }
    lastNow = now;
    requestAnimationFrame(frame);
  }

  /* Splits the kept part at a measurement: the bin of the drawn world stays coupled,
     the rest is cut into bins no wider than delta, each one an independent ensemble. */
  function doMeasure() {
    var part = parts[keptIndex], xs = part.state.x, n = xs.length;
    if (n < 2) return;
    var delta = +els.delta.value, t = part.state.t;
    var r = Model.measure(part.state, delta, Math.random);

    function cut(lo, hi) {
      var out = [], a = lo;
      for (var m = lo + 1; m <= hi; m++) {
        if (xs[m] - xs[a] > delta) { out.push([a, m - 1]); a = m; }
      }
      if (a <= hi) out.push([a, hi]);
      return out;
    }

    var ranges = cut(0, r.first - 1).concat([[r.first, r.last]], cut(r.last + 1, n - 1));
    var binParts = [], newKept = -1;
    ranges.forEach(function (range) {
      var p = { state: Model.condition(part.state, range[0], range[1]), first: part.first + range[0] };
      if (range[0] === r.first) newKept = binParts.length;
      binParts.push(p);
      if (range[0] !== r.first) {
        for (var j = part.first + range[0]; j <= part.first + range[1]; j++) discardedAt[j] = t;
      }
    });
    parts = parts.slice(0, keptIndex).concat(binParts, parts.slice(keptIndex + 1));
    keptIndex += newKept;
    chosen = part.first + r.chosen;
    measureTimes.push(t);
    lastMeasure = { i: chosen + 1, n: totalWorlds, k: r.last - r.first + 1 };
    els.measureNote.textContent = I18n.t('msgMeasured', lastMeasure);
    refresh(false);
  }

  function setScenario(value) {
    scenario = value;
    document.querySelectorAll('[data-scenario]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.scenario === scenario);
      b.setAttribute('aria-pressed', b.dataset.scenario === scenario);
    });
    els.scenarioNote.innerHTML = I18n.t(NOTE_KEYS[scenario]);
    els.speedGroup.hidden = scenario !== 'collision';
    els.deltaGroup.hidden = scenario !== 'measure';
  }

  function setPlaying(on) {
    playing = on;
    els.play.dataset.i18n = on ? 'pause' : 'play';
    els.play.textContent = I18n.t(els.play.dataset.i18n);
  }

  function updateUrl() {
    var q = new URLSearchParams({
      sc: scenario, N: els.worlds.value, w: els.omega.value, v0: els.speed.value,
      d: els.delta.value, lang: I18n.getLanguage()
    });
    try { history.replaceState(null, '', '?' + q); } catch (e) { /* not allowed on some file:// setups */ }
  }

  function bindPair(range, num, onChange) {
    range.addEventListener('input', function () { num.value = range.value; onChange(); });
    num.addEventListener('input', function () {
      var v = parseFloat(num.value);
      if (isNaN(v)) return;
      range.value = Math.min(parseFloat(range.max), Math.max(parseFloat(range.min), v));
      onChange();
    });
  }

  /* Initial state: query string, then defaults; a change of language or theme redraws everything */
  var qs = new URLSearchParams(location.search);
  Settings.init(function () {
    els.scenarioNote.innerHTML = I18n.t(NOTE_KEYS[scenario]);
    els.play.textContent = I18n.t(els.play.dataset.i18n || 'pause');
    if (lastMeasure) els.measureNote.textContent = I18n.t('msgMeasured', lastMeasure);
    refresh(false);
  });
  setPair(els.worlds, els.worldsNum, clamp(qs.get('N'), LIMITS.worlds, 20));
  setPair(els.omega, els.omegaNum, clamp(qs.get('w'), LIMITS.omega, 1));
  setPair(els.speed, els.speedNum, clamp(qs.get('v0'), LIMITS.speed, 3));
  setPair(els.delta, els.deltaNum, clamp(qs.get('d'), LIMITS.delta, 0.4));
  setScenario(SCENARIOS.indexOf(qs.get('sc')) >= 0 ? qs.get('sc') : 'ground');
  setPlaying(true);
  build();
  requestAnimationFrame(frame);

  bindPair(els.worlds, els.worldsNum, build);
  bindPair(els.omega, els.omegaNum, build);
  bindPair(els.speed, els.speedNum, build);
  bindPair(els.delta, els.deltaNum, updateUrl);
  els.play.addEventListener('click', function () { setPlaying(!playing); });
  els.restart.addEventListener('click', build);
  els.measureBtn.addEventListener('click', doMeasure);
  document.querySelectorAll('[data-scenario]').forEach(function (b) {
    b.addEventListener('click', function () { setScenario(b.dataset.scenario); build(); });
  });
})();

</script>
</body>
</html>
