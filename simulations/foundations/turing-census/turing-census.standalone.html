<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Censimento delle macchine di Turing</title>
<style>
/* Theme tokens: light on :root, dark for the system preference (unless light is forced) and for the explicit choice */
:root {
  --bg: #f7f7f5;
  --panel: #ffffff;
  --control: #fafafa;
  --text: #222;
  --muted: #666;
  --border: #ddd;
  --stat: #3a6ea5;
  --mov: #e07b1a;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #eb6834;
  --ramp-1: #cde2fb;
  --ramp-2: #9ec5f4;
  --ramp-3: #5598e7;
  --ramp-4: #2a78d6;
  --ramp-5: #184f95;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1d22;
    --panel: #23262d;
    --control: #2c3038;
    --text: #e6e6e6;
    --muted: #a0a3aa;
    --border: #3a3d45;
    --grid: #2c2c2a;
    --axis: #383835;
    --accent: #d95926;
    --ramp-1: #184f95;
    --ramp-2: #256abf;
    --ramp-3: #3987e5;
    --ramp-4: #6da7ec;
    --ramp-5: #b7d3f6;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #1b1d22;
  --panel: #23262d;
  --control: #2c3038;
  --text: #e6e6e6;
  --muted: #a0a3aa;
  --border: #3a3d45;
  --grid: #2c2c2a;
  --axis: #383835;
  --accent: #d95926;
  --ramp-1: #184f95;
  --ramp-2: #256abf;
  --ramp-3: #3987e5;
  --ramp-4: #6da7ec;
  --ramp-5: #b7d3f6;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}

body { display: flex; }

#panel {
  width: 340px;
  flex: 0 0 340px;
  height: 100%;
  overflow-y: auto;
  padding: 16px 18px 24px;
  background: var(--panel);
  border-right: 1px solid var(--border);
}

#view { flex: 1 1 auto; height: 100%; min-width: 0; position: relative; }

#graphBox { position: absolute; inset: 0; }
#graphBox canvas { display: block; }

h1 { font-size: 20px; margin: 0 0 8px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
.intro { margin: 0; line-height: 1.45; }

label, .label { display: block; margin: 10px 0 4px; }

input[type=range] { width: 100%; height: 44px; margin: 0; cursor: pointer; }
input[type=number], select {
  min-height: 44px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--control);
  color: var(--text);
  font: inherit;
}
input[type=number] { width: 96px; }

.row { display: flex; gap: 8px; align-items: center; }
.row input[type=range] { flex: 1 1 auto; }

.note { color: var(--muted); font-size: 12px; line-height: 1.4; margin: 6px 0 0; }

.buttons { display: flex; gap: 6px; }
.buttons button {
  flex: 1 1 0;
  min-height: 44px;
  padding: 6px 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--control);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}
.buttons button.active { background: var(--stat); color: #fff; border-color: var(--stat); }
input:disabled, .buttons button:disabled { opacity: .45; cursor: default; }

:focus-visible { outline: 2px solid var(--mov); outline-offset: 2px; }

#readout { width: 100%; border-collapse: collapse; }
#readout th { text-align: left; font-weight: normal; color: var(--muted); width: 60%; }
#readout td { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
#readout th, #readout td { padding: 6px 2px; border-bottom: 1px solid var(--border); }

.legend { list-style: none; margin: 0; padding: 0; }
.legend li { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.sw { flex: 0 0 auto; display: inline-block; width: 18px; height: 12px; border-radius: 2px; }
.sw-bar { background: var(--ramp-3); }
.sw-ramp { background: linear-gradient(90deg, var(--ramp-1), var(--ramp-5)); }
.sw-strip { background: var(--ramp-2); }
.sw-accent { background: var(--accent); }

#tooltip {
  position: absolute;
  pointer-events: none;
  max-width: 260px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
  font-size: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
}
#tooltip b { display: block; margin-bottom: 4px; }
#tooltip div { display: flex; justify-content: space-between; gap: 12px; }
#tooltip div span:first-child { color: var(--muted); }
#tooltip div span:last-child { font-variant-numeric: tabular-nums; }

.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 760px) {
  body { flex-direction: column; }
  #panel { width: 100%; flex: 0 0 auto; height: auto; max-height: 50%; border-right: 0; border-bottom: 1px solid var(--border); }
  #view { height: 50%; }
}

</style>
<style>
/* Language and theme overlay (shared/js/settings.js); colors come from the page's theme tokens */
.settings-overlay { position: fixed; top: 10px; right: 10px; z-index: 10; }

.settings-toggle {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
}
.settings-toggle svg { width: 22px; height: 22px; }

.settings-panel {
  position: absolute;
  top: 52px;
  right: 0;
  width: 260px;
  max-width: calc(100vw - 20px);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 10px;
  align-items: center;
  padding: 12px 14px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
}
.settings-panel[hidden] { display: none; }
.settings-panel h2 { grid-column: 1 / -1; margin: 0; }
.settings-panel label { margin: 0; }

/* on narrow screens the side panel is on top: keep its title clear of the button */
@media (max-width: 760px) {
  #panel h1 { padding-right: 52px; }
}

</style>
</head>
<body>
<aside id="panel">
  <h1 data-i18n="heading"></h1>
  <p class="intro" data-i18n-html="intro"></p>

  <h2 data-i18n="parameters"></h2>
  <span id="statesLabel" class="label" data-i18n="statesLabel"></span>
  <div class="buttons" role="group" aria-labelledby="statesLabel">
    <button type="button" data-states="2" data-i18n="states2"></button>
    <button type="button" data-states="3" data-i18n="states3"></button>
    <button type="button" data-states="4" data-i18n="states4"></button>
  </div>
  <p class="note" id="modeNote"></p>
  <label for="seed" data-i18n="seedLabel"></label>
  <input type="number" id="seed" min="0" max="99999" step="1" value="1">
  <label id="samplesLabel" for="samples" data-i18n="samplesLabel"></label>
  <div class="row">
    <input type="range" id="samples" min="100000" max="10000000" step="100000" value="1000000">
    <input type="number" id="samplesNum" min="100000" max="10000000" step="100000" value="1000000" aria-labelledby="samplesLabel">
  </div>

  <h2 data-i18n="run"></h2>
  <div class="buttons"><button type="button" id="play" data-i18n="pause"></button></div>

  <h2 data-i18n="scale"></h2>
  <div class="buttons">
    <button type="button" data-scale="lin" data-i18n="scaleLin"></button>
    <button type="button" data-scale="log" data-i18n="scaleLog"></button>
  </div>

  <h2 data-i18n="readings"></h2>
  <table id="readout">
    <tr><th data-i18n="rMachines"></th><td id="rMachines"></td></tr>
    <tr><th data-i18n="rHalting"></th><td id="rHalting"></td></tr>
    <tr><th data-i18n="rDistinct"></th><td id="rDistinct"></td></tr>
    <tr><th data-i18n="rLongest"></th><td id="rLongest"></td></tr>
    <tr><th data-i18n="rTop"></th><td id="rTop"></td></tr>
  </table>

  <h2 data-i18n="legend"></h2>
  <ul class="legend">
    <li><span class="sw sw-bar"></span><span data-i18n="legBar"></span></li>
    <li><span class="sw sw-ramp"></span><span data-i18n="legColour"></span></li>
    <li><span class="sw sw-strip"></span><span data-i18n="legStrip"></span></li>
    <li><span class="sw sw-accent"></span><span data-i18n="legAccent"></span></li>
  </ul>
  <p class="note" data-i18n-html="docNote"></p>
</aside>

<main id="view">
  <div id="graphBox">
    <span id="graphTitle" class="visually-hidden" data-i18n="graphAria"></span>
    <canvas id="graph" role="img" aria-labelledby="graphTitle"></canvas>
    <div id="tooltip" hidden></div>
  </div>
</main>

<script>
/*
 * model.js: census of the n-state 2-symbol Turing machines in the busy beaver
 * formalism. Pure functions, no DOM, also usable from Node.
 *
 * A machine has one instruction per (state, symbol) pair: write 0 or 1, move
 * left or right, then go to one of the n states or halt. The halting instruction
 * still writes and moves, as in Rado's formalism, so each pair has 4(n+1)
 * choices and there are (4(n+1))^(2n) machines. Every machine starts in state 0
 * on a tape of zeros; the output of a halting machine is the segment of cells it
 * scanned. The number of machines per output approximates the algorithmic
 * probability of the string: simple strings come from many more machines.
 *
 * The step cap is the busy beaver record S(n): a machine still running after
 * S(n) steps on the blank tape never halts, so for n = 2 and 3 the full
 * enumeration is exact. For n = 4 there are 2.56e10 machines, too many to
 * enumerate, and the census draws a seeded random sample, capped at S(4) = 107.
 */

<script>
/*
 * app.js: wires the controls to the census and the renderer. The census runs in
 * time-boxed requestAnimationFrame slices so the page stays responsive; language
 * and theme come from the shared overlay (shared/js/settings.js) and the state is

  var els = {};

    'rMachines', 'rHalting', 'rDistinct', 'rLongest', 'rTop'

  }

    states = value;

      b.setAttribute('aria-pressed', +b.dataset.states === states);
    });

    els.seed.disabled = !sampled;
    els.samples.disabled = !sampled;
    els.samplesNum.disabled = !sampled;
    els.modeNote.textContent = I18n.t(sampled ? 'modeNoteSample' : 'modeNoteFull', {
      total: Model.machineCount(states).toLocaleString(document.documentElement.lang),
      n: states,
      cap: Model.stepCap(states)

  }

  function setScale(value) {
    scale = value;
    document.querySelectorAll('[data-scale]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.scale === scale);

    els.rHalting.textContent = census.done
      ? formatCount(census.halting) + ' (' + formatShare(census.halting / census.done) + ')' : '0';
    els.rDistinct.textContent = formatCount(s.entries.length);

  }

    if (!playing && rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    syncPlay();
  }

    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    census = Model.create({ states: states, seed: +els.seed.value, samples: +els.samples.value });
    playing = false;
    refresh();
    setPlaying(true);
  }

    var q = new URLSearchParams({
      n: states, seed: els.seed.value, samples: els.samples.value, scale: scale, lang: I18n.getLanguage()

  els.seed.value = clamp(qs.get('seed'), LIMITS.seed, 1);

  });

})();
